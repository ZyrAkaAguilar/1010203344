<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craftia Championship - ZyrIsland</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="steam-theme">

    <div id="system-status-overlay" class="system-status-overlay hidden">
        <div class="system-status-box">
            <div id="status-icon-box"></div>
            <h1 id="status-title" class="status-title-text">Cargando estado...</h1>
            <p id="status-message" class="status-message-text">Verificando conexión con los servidores.</p>
            <div id="status-time-badge" class="status-badge-time hidden"></div>
        </div>
    </div>

    <div class="app-window">
        <div class="window-title-bar">
            <div class="window-title"><i class="fa-solid fa-island-tropical"></i> ZYRISLAND CLIENT - CRAFTIA CHAMPIONSHIP</div>
        </div>

        <div style="padding: 30px; max-width: 900px; margin: 0 auto; overflow-y: auto;">
            <a href="../index.html" class="steam-btn" style="background: rgba(255,255,255,0.05); color: #fff; margin-bottom: 20px;">
                <i class="fa-solid fa-arrow-left"></i> Volver al Panel
            </a>

            <div style="background: var(--steam-card-bg); border: 1px solid var(--steam-border); border-radius: 16px; overflow: hidden; padding: 24px;">
                <h1 style="font-size: 1.8rem; font-weight: 800; color: #fff; margin-bottom: 12px;">Craftia Championship S1</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; margin-bottom: 20px;">
                    Instancia oficial de Craftia Championship. Incluye modpack optimizado y paquete de texturas.
                </p>

                <button id="start-download-btn" class="steam-btn btn-orange btn-block" style="font-size: 1rem; padding: 14px;">
                    <i class="fa-solid fa-download"></i> Descargar Instancia Completa
                </button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/security.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/downloader.js"></script>
</body>
</html>
